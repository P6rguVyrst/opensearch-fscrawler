---
# Index PDF documents only
name: "pdf"
fs:
  url: "/data"

  includes:
    - "*.pdf"
  excludes: []
  follow_symlinks: false
  remove_deleted: false
  continue_on_error: false
  index_content: true
  add_filesize: true
  index_folders: true
  checksum: "MD5"
  tika_url: "http://tika:9998"
elasticsearch:
  nodes:
    - url: "http://opensearch:9200"
  ssl_verification: false
  bulk_size: 100
  byte_size: "10mb"
  push_templates: true
rest:
  # 0.0.0.0 is correct here — this runs inside a container where it must accept
  # connections on all interfaces for docker-compose port mapping to work.
  # External exposure is limited by the 127.0.0.1 host binding in docker-compose.yml.
  url: "http://0.0.0.0:8081"
  enable_cors: false
