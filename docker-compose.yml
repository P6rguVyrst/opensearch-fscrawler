---
# FSCrawler Python edition — docker-compose development stack
# Services: OpenSearch, OpenSearch Dashboards, Apache Tika, FSCrawler
#
# Usage:
#   docker compose up -d            # start everything
#   docker compose logs -f fscrawler
#   docker compose down             # stop and remove containers

services:

  opensearch:
    image: opensearchproject/opensearch:3.5.0@sha256:dbb01641baadae5104e18acd888bf05e8fdd9af3567fd30624a76ba3e5a31dec
    container_name: fscrawler-opensearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD} # required ≥ 2.12
      - plugins.security.disabled=true                                         # disable security for dev
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.5.0@sha256:03afc96f2f50a02246294aaa37adffc41270104676eff7c5f377c40ae9dd1ff2
    container_name: fscrawler-dashboards
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"

  tika:
    image: apache/tika:latest-full@sha256:ecdd37e204308266b1f8e28569f8516ebd5b96d7a4518a71d3904710b20c03b3
    container_name: fscrawler-tika
    ports:
      - "9998:9998"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9998/tika | grep -q 'Apache Tika'"]
      interval: 10s
      timeout: 5s
      retries: 10

  fscrawler-markdown:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fscrawler-markdown
    depends_on:
      opensearch:
        condition: service_healthy
      tika:
        condition: service_healthy
    volumes:
      - ./config:/home/fscrawler/.fscrawler
      - ./playground/data:/data
    ports:
      - "8080:8080"
    command: ["--config_dir", "/home/fscrawler/.fscrawler", "--loop", "--", "markdown"]

  fscrawler-pdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fscrawler-pdf
    depends_on:
      opensearch:
        condition: service_healthy
      tika:
        condition: service_healthy
    volumes:
      - ./config:/home/fscrawler/.fscrawler
      - ./playground/data:/data
    ports:
      - "8081:8081"
    command: ["--config_dir", "/home/fscrawler/.fscrawler", "--loop", "--", "pdf"]

  fscrawler-catchall:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fscrawler-catchall
    depends_on:
      opensearch:
        condition: service_healthy
      tika:
        condition: service_healthy
    volumes:
      - ./config:/home/fscrawler/.fscrawler
      - ./playground/data:/data
    ports:
      - "8082:8082"
    command: ["--config_dir", "/home/fscrawler/.fscrawler", "--loop", "--", "catchall"]

volumes:
  opensearch-data:
    driver: local
